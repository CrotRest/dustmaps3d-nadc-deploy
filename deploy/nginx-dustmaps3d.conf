# 3D Dust Map website — nginx locations.
#
# Paste the `location` blocks below INSIDE the existing `server { ... }` block that serves
# nadc.china-vo.org (or include this file there). They only claim paths under the prefix
# /data/dustmaps3d/ and do not touch anything else on the server.
#
# If you use another prefix, replace every "/data/dustmaps3d/" in this file (keep the
# trailing slash) — nothing in the website itself has to change:
#   sed -i 's#/data/dustmaps3d/#/your/prefix/#g; s#/data/dustmaps3d #/your/prefix #g' nginx-dustmaps3d.conf
#
# Also add this ONE line at the `http { ... }` level (outside any server block), once:
#   limit_req_zone $binary_remote_addr zone=dustmaps3d_api:10m rate=30r/m;
#
# Check and reload:  nginx -t && systemctl reload nginx

# /data/dustmaps3d  ->  /data/dustmaps3d/  (the site uses page-relative URLs; the slash is required)
location = /data/dustmaps3d {
    return 301 /data/dustmaps3d/;
}

# Static website (unpacked from site/). Hashed assets are cached for a year, the page itself is not.
location /data/dustmaps3d/ {
    alias /opt/dustmaps3d/site/;
    index index.html;
    add_header Cache-Control "no-cache";
}
location /data/dustmaps3d/assets/ {
    alias /opt/dustmaps3d/site/assets/;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

# Backend API (FastAPI on 127.0.0.1:58123). Maps take up to ~30 s, a bubble panel set ~40 s.
location /data/dustmaps3d/api/ {
    proxy_pass http://127.0.0.1:58123/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    client_max_body_size 21m;          # batch uploads: backend limit is 20 MB
    limit_req zone=dustmaps3d_api burst=20 nodelay;
    limit_req_status 429;
}

# The website never saves bubble results; keep the backend's write endpoint closed to the public.
location = /data/dustmaps3d/api/v2/bubbles {
    return 403;
}

# Images the backend generates (served by the backend from its var/results directory).
location /data/dustmaps3d/files/ {
    proxy_pass http://127.0.0.1:58123/files/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_read_timeout 60s;
    add_header Cache-Control "public, max-age=3600";
}
